name: Build paper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: paper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect numeric LaTeX changes
        id: number-scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "Rendered-number scan enabled for main/manual run."
          elif git diff --word-diff=porcelain \
            --word-diff-regex='[0-9]+([.,][0-9]+)*' \
            "$BASE_SHA" "$HEAD_SHA" -- '*.tex' \
            | grep -Eq '^[+-][^+-]*[0-9]'; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "Rendered-number scan enabled: numeric LaTeX lines changed."
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "Rendered-number scan skipped: no numeric LaTeX lines changed."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ktwu01/benchmark-radar
          ref: 8f46bbfa91f5d9900c8b08a5d552c3df5c9597b0
          path: frozen-software
      - name: Verify findings against the frozen v0.11.0 release
        run: |
          python -m pip install pytest PyYAML
          python scripts/verify_frozen_findings.py frozen-software
          python -m pytest -q tests
      - name: Resolve the TeX package set
        id: tex-packages
        env:
          NUMBER_SCAN: ${{ steps.number-scan.outputs.enabled }}
        run: |
          packages="latexmk texlive-latex-extra texlive-fonts-recommended texlive-pictures"
          if [[ "$NUMBER_SCAN" == "1" ]]; then
            packages="$packages poppler-utils tesseract-ocr"
          fi
          echo "list=$packages" >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s' "$packages" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Fetching TeX Live dominates the job and the package set almost never
      # changes, so keep the downloaded archives between runs.
      - name: Restore the cached TeX archives
        id: tex-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/tex-archives/*.deb
          key: tex-archives-${{ runner.os }}-${{ steps.tex-packages.outputs.key }}
      - name: Download the TeX archives
        if: steps.tex-cache.outputs.cache-hit != 'true'
        env:
          PACKAGES: ${{ steps.tex-packages.outputs.list }}
        run: |
          sudo apt-get update
          mkdir -p "$HOME/tex-archives/partial"
          sudo apt-get install -y --download-only --no-install-recommends \
            -o Dir::Cache::archives="$HOME/tex-archives" $PACKAGES
          sudo chown -R "$(id -u):$(id -g)" "$HOME/tex-archives"
      - name: Install TeX and PDF number scanning tools
        run: |
          # The texlive-base postinst rebuilds every TeX format, which costs
          # more than the rest of the install combined. The paper is built with
          # pdflatex alone, so stub the rebuild out and make that one format
          # afterwards. /usr/local/bin precedes /usr/bin on the sudo path.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/fmtutil-sys >/dev/null
          sudo chmod +x /usr/local/bin/fmtutil-sys
          sudo dpkg --install --force-depends "$HOME"/tex-archives/*.deb
          sudo apt-get install -y --fix-broken --no-download
          sudo rm -f /usr/local/bin/fmtutil-sys
          sudo fmtutil-sys --byfmt pdflatex
      - name: Build paper and standalone arXiv package
        env:
          CHECK_SMALL_NUMBERS: ${{ steps.number-scan.outputs.enabled }}
        run: |
          make arxiv
          mkdir -p /tmp/arxiv-check
          tar -xzf arxiv.tar.gz -C /tmp/arxiv-check
          cd /tmp/arxiv-check
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper
          path: |
            main.pdf
            arxiv.tar.gz
            build/small-number-warnings.json
          if-no-files-found: error
